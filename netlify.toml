[images]
  remote_images = ["https://source.unsplash.com/.*", "https://images.unsplash.com/.*", "https://ext.same-assets.com/.*", "https://ugc.same-assets.com/.*"]

[build]
  command = "bun run build"
  publish = ".next"

[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "http://fantasyarena.wiki/*"
  to = "https://fantasyarena.wiki/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.fantasyarena.wiki/*"
  to = "https://fantasyarena.wiki/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.fantasyarena.wiki/*"
  to = "https://fantasyarena.wiki/:splat"
  status = 301
  force = true
